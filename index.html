 <!DOCTYPE html>
<html>
<head>
    <title>Attendance Percentage Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Attendance Percentage Checker</h1>
        <p>Calculate your attendance percentage easily.</p>

        <div class="box">
            <label>Total Classes</label>
            <input type="number" id="total" placeholder="Enter total classes">

            <label>Attended Classes</label>
            <input type="number" id="attended" placeholder="Enter attended classes">

            <label>Required Attendance %</label>
            <input type="number" id="required" placeholder="Example: 75">

            <button onclick="calculate()">Calculate Attendance</button>

            <div id="result"></div>
        </div>
    </div>

    <footer>
        BCA Mini Project
    </footer>

    <script src="script.js"></script>
</body>
</html>
